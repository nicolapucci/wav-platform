events {}

http {
    # DNS interno di Docker (Docker Desktop e la maggior parte delle installazioni
    # usano 127.0.0.11 per la rete di un progetto compose). Usarlo esplicitamente,
    # insieme a variabili in proxy_pass, fa sì che nginx ri-risolva il nome del
    # servizio ogni `valid` secondi invece di cachare l'IP per sempre come succede
    # con un "upstream { server nome:porta; }" statico (quello risolve una volta
    # sola all'avvio di nginx: se poi un container viene ricreato con un IP diverso,
    # nginx continua a usare l'IP vecchio, che Docker può nel frattempo aver
    # riassegnato a un container completamente diverso).
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # Challenge HTTP-01 di Let's Encrypt: certbot scrive qui (volume
        # "certbot-webroot" condiviso) e Let's Encrypt la legge in chiaro su :80,
        # quindi deve restare raggiungibile PRIMA del redirect a https.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;

        # Stesso percorso in sviluppo e in produzione, così questo file non dipende
        # dal dominio: in sviluppo è un self-signed (vedi il commento sul volume
        # "certs" in docker-compose.yml), sul deploy pubblico certbot lo
        # sovrascrive con quello Let's Encrypt (nginx/certbot/entrypoint.sh,
        # comando deploy-hook) e nginx lo rilegge al reload periodico.
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        location /auth/ {
            set $upstream http://auth-service:8000;
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            set $upstream http://api-service:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws {
            set $upstream http://ws-gateway:8000;
            # proxy_pass con URI costruito da variabile (necessario per la
            # ri-risoluzione DNS periodica, vedi commento sul resolver sopra) non
            # inoltra automaticamente la query string come farebbe con un URI
            # statico: senza $is_args$args il token sparisce e ws-gateway rifiuta
            # l'handshake con 403 perché gli manca il parametro ?token= richiesto.
            proxy_pass $upstream/ws$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            set $upstream http://frontend:80;
            proxy_pass $upstream;
            proxy_set_header Host $host;
        }
    }
}
