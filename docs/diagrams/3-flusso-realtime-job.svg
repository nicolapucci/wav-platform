<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Da una modifica all&#x27;aggiornamento in tempo reale e ai job in coda">
<title>Da una modifica all'aggiornamento in tempo reale e ai job in coda</title>
<desc>L'utente A modifica una task: api-service verifica i permessi, scrive su PostgreSQL, pubblica un evento Pub/Sub e accoda un job, poi risponde 200. L'evento arriva a ws-gateway e all'utente B via WebSocket; il job viene eseguito da un worker, con retry e dead-letter in caso di errore.</desc>
