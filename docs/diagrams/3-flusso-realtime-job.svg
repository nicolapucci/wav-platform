<text x="44.0" y="778.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#1B2433">I passi 4 e 5 avviano due percorsi indipendenti</tspan></text>
<text x="44.0" y="812.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" fill="#566175" text-anchor="start">l'utente A riceve 200 OK senza aspettare né il push (fase 2)</text>
<text x="44.0" y="842.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" fill="#566175" text-anchor="start">né il job (fase 3); l'utente B vede la modifica subito.</text>
