<text x="784.0" y="809.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">nessun XACK: il job resta pending nel gruppo Redis</text>
<text x="784.0" y="837.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">dopo 30 s un altro worker lo riprende (XCLAIM) e riprova</text>
<text x="784.0" y="865.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#1B2433" text-anchor="start">dopo 3 tentativi finisce in stream:jobs:dead (dead-letter)</text>
