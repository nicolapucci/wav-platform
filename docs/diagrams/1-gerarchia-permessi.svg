<rect x="466" y="408" width="1052" height="52" rx="12" fill="#E7F0FF" stroke="#2F6BE0" stroke-width="2.5"/>
<text x="488.0" y="442.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#1B2433">Marco</tspan><tspan font-weight="400" fill="#1B2433"> · editor sul progetto</tspan></text>
<rect x="852" y="476" width="666" height="52" rx="12" fill="#EEF1F6" stroke="#64748B" stroke-width="2.5"/>
<text x="874.0" y="510.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#1B2433">Sara</tspan><tspan font-weight="400" fill="#1B2433"> · reader sul layer «Backend»</tspan></text>
<text x="80.0" y="606.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#D13B3B">CANCELLAZIONE LOGICA</tspan><tspan font-weight="400" fill="#566175">  ·  archived_at scende a cascata, nulla viene cancellato dal database</tspan></text>
<polyline points="220.0,670.0 1453.0,670.0" fill="none" stroke="#D13B3B" stroke-width="3.4" stroke-linejoin="round"/>
<polygon points="1468.0,670.0 1453.0,676.5 1453.0,663.5" fill="#D13B3B"/>
<circle cx="220.0" cy="670" r="10" fill="#D13B3B" stroke="#FFFFFF" stroke-width="3"/>
<circle cx="606.0" cy="670" r="10" fill="#D13B3B" stroke="#FFFFFF" stroke-width="3"/>
<circle cx="992.0" cy="670" r="10" fill="#D13B3B" stroke="#FFFFFF" stroke-width="3"/>
<circle cx="1378.0" cy="670" r="10" fill="#D13B3B" stroke="#FFFFFF" stroke-width="3"/>
<text x="220.0" y="714.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#1B2433" text-anchor="middle">elimina l'organizzazione</text>
<text x="606.0" y="714.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#1B2433" text-anchor="middle">archivia i progetti</text>
<text x="992.0" y="714.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#1B2433" text-anchor="middle">archivia i layer</text>
<text x="1378.0" y="714.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" fill="#1B2433" text-anchor="middle">archivia le task</text>
<text x="800.0" y="800.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="400" fill="#566175" text-anchor="middle">Il ruolo effettivo di un utente su una task è il più alto trovato risalendo task → layer → progetto → organizzazione,</text>
<text x="800.0" y="830.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="400" fill="#566175" text-anchor="middle">sia tra i suoi ruoli diretti sia tra quelli dei team a cui appartiene.</text>
</svg>
