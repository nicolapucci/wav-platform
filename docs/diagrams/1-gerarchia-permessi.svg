<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Gerarchia dei dati e permessi ereditati">
<title>Gerarchia dei dati e permessi ereditati</title>
<desc>Organizzazione, progetto, layer e task. Un ruolo assegnato a un livello vale per tutto cio' che sta sotto; la cancellazione logica scende a cascata nello stesso verso.</desc>
