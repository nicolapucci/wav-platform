<text x="80.0" y="320.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#1B2433">PERMESSI</tspan><tspan font-weight="400" fill="#566175">  ·  un ruolo vale per il livello in cui è assegnato e per tutto ciò che sta sotto</tspan></text>
<text x="1518.0" y="320.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#5B54D6" text-anchor="end">reader &lt; editor &lt; admin &lt; owner</text>
<rect x="80" y="340" width="1438" height="52" rx="12" fill="#ECEBFF" stroke="#5B54D6" stroke-width="2.5"/>
