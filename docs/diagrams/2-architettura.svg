<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Architettura a servizi con un solo ingresso pubblico">
<title>Architettura a servizi con un solo ingresso pubblico</title>
<desc>Il browser parla HTTPS/WSS con nginx, unico ingresso; nginx instrada verso frontend, auth-service, api-service e ws-gateway. Il worker consuma la coda Redis. Tutti i servizi condividono la libreria wav_core e usano PostgreSQL, Redis e (in futuro) MinIO.</desc>
