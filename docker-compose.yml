services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wav}
      POSTGRES_DB: wav
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      # Solo da questo host (127.0.0.1), mai esposto all'esterno: nessun
      # servizio fuori da questa rete compose deve raggiungere postgres
      # direttamente - nginx è l'unico ingresso pubblico. Ancora utile in
      # locale per un client DB diretto (o via "ssh -L 5432:localhost:5432"
      # su un deploy remoto).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wav"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # redis non ha nessuna autenticazione configurata (vedi REDIS_URL): a
      # maggior ragione mai esposto oltre localhost, stesso motivo di postgres
      # sopra.
      - "127.0.0.1:6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wavminio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wavminio123}
    volumes:
      - minio-data:/data
    ports:
      # Stesso motivo di postgres sopra - la console S3 non deve essere
      # raggiungibile da fuori questo host.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Diretto solo da questo host - da fuori si passa per nginx (che fa
      # anche TLS, questi non lo fanno).
      - "127.0.0.1:8001:8000"

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  ws-gateway:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8000"

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      # Idem: da fuori si passa per nginx, questo resta un accesso diretto di
      # comodo solo dalla VM stessa.
      - "127.0.0.1:5173:80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificato self-signed, non committato (vedi .gitignore). Rigenerarlo con:
      #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
      #     -keyout nginx/certs/tls.key -out nginx/certs/tls.crt -subj "/CN=localhost"
      # (su Git Bash/Windows: prefissare con MSYS_NO_PATHCONV=1, altrimenti "/CN=..."
      # viene interpretato come un path di filesystem). Da sostituire con un
      # certificato Let's Encrypt quando si prepara il deploy vero.
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-service
      - ws-gateway
      - auth-service
      - frontend

volumes:
  pgdata:
  minio-data:

# Scalare orizzontalmente in locale (docker-compose non supporta "deploy.replicas"
# fuori da Swarm), ad es.:
#   docker compose up --scale api-service=3 --scale ws-gateway=2 --scale worker-service=3
