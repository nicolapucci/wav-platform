services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wav
      POSTGRES_PASSWORD: wav
      POSTGRES_DB: wav
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wav"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wavminio
      MINIO_ROOT_PASSWORD: wavminio123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  ws-gateway:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    env_file: .env
    depends_on:
      - redis
    ports:
      - "8002:8000"

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-service
      - ws-gateway
      - auth-service
      - frontend

volumes:
  pgdata:
  minio-data:

# Scalare orizzontalmente in locale (docker-compose non supporta "deploy.replicas"
# fuori da Swarm), ad es.:
#   docker compose up --scale api-service=3 --scale ws-gateway=2 --scale worker-service=3
