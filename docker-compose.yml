services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wav}
      POSTGRES_DB: wav
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      # Solo da questo host (127.0.0.1), mai esposto all'esterno: nessun
      # servizio fuori da questa rete compose deve raggiungere postgres
      # direttamente - nginx è l'unico ingresso pubblico. Ancora utile in
      # locale per un client DB diretto (o via "ssh -L 5432:localhost:5432"
      # su un deploy remoto).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wav"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # redis non ha nessuna autenticazione configurata (vedi REDIS_URL): a
      # maggior ragione mai esposto oltre localhost, stesso motivo di postgres
      # sopra.
      - "127.0.0.1:6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wavminio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wavminio123}
    volumes:
      - minio-data:/data
    ports:
      # Stesso motivo di postgres sopra - la console S3 non deve essere
      # raggiungibile da fuori questo host.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Diretto solo da questo host - da fuori si passa per nginx (che fa
      # anche TLS, questi non lo fanno).
      - "127.0.0.1:8001:8000"

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  ws-gateway:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8000"

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      # Idem: da fuori si passa per nginx, questo resta un accesso diretto di
      # comodo solo dalla VM stessa.
      - "127.0.0.1:5173:80"

  nginx:
    image: nginx:alpine
    # Come il comando di default dell'immagine, più un reload ogni 6 ore: è così che
    # nginx prende il certificato rinnovato da certbot (servizio sotto), senza
    # segnali tra container né accesso al socket Docker.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # In sviluppo un certificato self-signed, non committato (vedi .gitignore).
      # Rigenerarlo con:
      #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
      #     -keyout nginx/certs/tls.key -out nginx/certs/tls.crt -subj "/CN=localhost"
      # (su Git Bash/Windows: prefissare con MSYS_NO_PATHCONV=1, altrimenti "/CN=..."
      # viene interpretato come un path di filesystem). Sul deploy pubblico lo
      # sostituisce certbot con quello Let's Encrypt, nello stesso percorso.
      - ./nginx/certs:/etc/nginx/certs:ro
      # Webroot della challenge HTTP-01 di Let's Encrypt (lo scrive certbot, sotto)
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-service
      - ws-gateway
      - auth-service
      - frontend

  # Let's Encrypt. Attivo solo col profilo "letsencrypt" (COMPOSE_PROFILES=letsencrypt
  # nel .env del deploy pubblico): in sviluppo, col self-signed, non serve. Il primo
  # certificato si ottiene con "sh nginx/init-letsencrypt.sh" (vedi README); da lì il
  # servizio prova a rinnovarlo ogni 12 ore. Il dominio è l'unico parametro (DOMAIN
  # nel .env): per cambiare provider/macchina basta cambiare quello.
  certbot:
    profiles: ["letsencrypt"]
    image: certbot/certbot
    entrypoint: ["/bin/sh", "/certbot/entrypoint.sh"]
    command: ["renew-loop"]
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-}
      CERTBOT_EXTRA_ARGS: ${CERTBOT_EXTRA_ARGS:-}
    volumes:
      - ./nginx/certbot/entrypoint.sh:/certbot/entrypoint.sh:ro
      # stato di certbot (account, certificati, config di rinnovo): va tenuto tra un
      # riavvio e l'altro - "docker compose down -v" lo cancella
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      # dove nginx legge tls.crt/tls.key (rw qui, ro nel servizio nginx)
      - ./nginx/certs:/nginx-certs

volumes:
  pgdata:
  minio-data:
  letsencrypt:
  certbot-webroot:

# Scalare orizzontalmente in locale (docker-compose non supporta "deploy.replicas"
# fuori da Swarm), ad es.:
#   docker compose up --scale api-service=3 --scale ws-gateway=2 --scale worker-service=3
