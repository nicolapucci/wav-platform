# imagePullPolicy Never: l'immagine e' quella buildata in locale da
# "docker compose build" (stesso image store del daemon Docker Desktop usato
# anche da k8s) - senza Never, il tag ":latest" farebbe si che kubelet provi
# a pullarla da un registry remoto invece di usare quella locale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: wav-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: wav-platform-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: wav-platform
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
