# imagePullPolicy Never: l'immagine e' quella buildata in locale da
# "docker compose build" (stesso image store del daemon Docker Desktop usato
# anche da k8s) - senza Never, il tag ":latest" farebbe si che kubelet provi
# a pullarla da un registry remoto invece di usare quella locale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: wav-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: wav-platform-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # richiesti dall'HPA qui sotto: senza resources.requests.cpu non ha
          # una base su cui calcolare una percentuale di utilizzo (target
          # 60%, vedi spec.metrics), e resterebbe sempre "<unknown>". I valori
          # sono tarati sull'uso reale osservato a riposo con "kubectl top
          # pods" su questo cluster (pochi mCPU), con margine per il picco che
          # deve far scattare lo scale-up.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: wav-platform
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
# Scala orizzontalmente in base al traffico: parte da 1 pod (come tutti i
# servizi stateless di questo namespace) e ne aggiunge fino a 5 quando la CPU
# media dei pod esistenti supera il 60% della richiesta sopra (100m) - stesso
# criterio applicato a api-service/ws-gateway/worker-service/frontend/nginx,
# vedi i rispettivi file. Esclusi deliberatamente postgres/redis/minio: sono
# stateful a istanza singola in questo setup, scalarli orizzontalmente
# creerebbe repliche indipendenti con stato incoerente tra loro (specialmente
# redis, che qui fa anche da pub/sub: un publish su una replica non
# sarebbe mai visto da un subscriber connesso a un'altra) invece di più
# capacità reale - richiederebbe un'architettura a cluster dedicata, non
# semplicemente più repliche dello stesso Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
  namespace: wav-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
