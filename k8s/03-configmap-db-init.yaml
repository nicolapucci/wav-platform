apiVersion: v1
data:
  0001_init.sql: |
    -- Schema iniziale piattaforma WAV
    -- Vedi docs/architettura.md per la spiegazione di ogni scelta.

    CREATE EXTENSION IF NOT EXISTS ltree;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    CREATE TYPE role_level AS ENUM ('reader','editor','admin','owner');
    CREATE TYPE principal_type AS ENUM ('user','team');
    CREATE TYPE grantable_resource_type AS ENUM ('organization','project','layer');
    CREATE TYPE notification_type AS ENUM ('mention','task_assigned','resource_updated','comment_reply');

    -- ---------------------------------------------------------------------------
    -- Utenti e autenticazione
    -- ---------------------------------------------------------------------------

    CREATE TABLE users (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      email TEXT UNIQUE NOT NULL,
      password_hash TEXT,
      display_name TEXT NOT NULL,
      avatar_url TEXT,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE oauth_identities (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      provider TEXT NOT NULL,
      provider_user_id TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      UNIQUE (provider, provider_user_id)
    );

    -- ---------------------------------------------------------------------------
    -- Gerarchia Organization -> Project -> Layer (ricorsivo)
    -- ---------------------------------------------------------------------------

    CREATE TABLE organizations (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name TEXT NOT NULL,
      slug TEXT UNIQUE NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE projects (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      organization_id UUID NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
      name TEXT NOT NULL,
      description TEXT,
      archived_at TIMESTAMPTZ,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE layers (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id UUID NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
      parent_layer_id UUID REFERENCES layers(id) ON DELETE CASCADE,
      name TEXT NOT NULL,
      description TEXT,
      path LTREE NOT NULL,
      archived_at TIMESTAMPTZ,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX layers_path_gist ON layers USING GIST (path);
    CREATE INDEX layers_project_idx ON layers(project_id);

    -- Colonne kanban di un progetto: create/modificate/riordinate/eliminate dagli
    -- utenti (con permessi, vedi projects.py), non più un set fisso di 3 stati.
    -- Ogni progetto ne ha almeno una (seminate alla creazione del progetto);
    -- alimentano sia la kanban di default per layer sia la dashboard/board custom.
    CREATE TABLE board_columns (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id UUID NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
      name TEXT NOT NULL,
      position INT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX board_columns_project_idx ON board_columns(project_id);

    -- ---------------------------------------------------------------------------
    -- Team e permessi polimorfici (utente o team)
    -- ---------------------------------------------------------------------------

    CREATE TABLE teams (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      organization_id UUID NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
      name TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE team_members (
      team_id UUID REFERENCES teams(id) ON DELETE CASCADE,
      user_id UUID REFERENCES users(id) ON DELETE CASCADE,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (team_id, user_id)
    );

    -- sostituisce organization_members / project_members / layer_members:
    -- un'unica tabella polimorfica, il "principal" è un utente o un team.
    -- Nota: principal_id non ha FK diretta (punterebbe a due tabelle diverse a
    -- seconda del tipo); l'integrità va validata a livello applicativo.
    CREATE TABLE role_assignments (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      principal_type principal_type NOT NULL,
      principal_id UUID NOT NULL,
      resource_type grantable_resource_type NOT NULL,
      resource_id UUID NOT NULL,
      role role_level NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      UNIQUE (principal_type, principal_id, resource_type, resource_id)
    );
    CREATE INDEX role_assignments_resource_idx ON role_assignments(resource_type, resource_id);
    CREATE INDEX role_assignments_principal_idx ON role_assignments(principal_type, principal_id);

    -- ---------------------------------------------------------------------------
    -- Task, assegnatari, dipendenze, watcher
    -- ---------------------------------------------------------------------------

    CREATE TABLE tasks (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      layer_id UUID NOT NULL REFERENCES layers(id) ON DELETE CASCADE,
      title TEXT NOT NULL,
      description TEXT,
      status_column_id UUID REFERENCES board_columns(id) ON DELETE SET NULL,
      priority SMALLINT NOT NULL DEFAULT 0,
      due_date DATE,
      created_by UUID NOT NULL REFERENCES users(id),
      archived_at TIMESTAMPTZ,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX tasks_layer_idx ON tasks(layer_id);
    CREATE INDEX tasks_status_column_idx ON tasks(status_column_id);
    CREATE INDEX tasks_title_trgm_idx ON tasks USING GIN (title gin_trgm_ops);

    CREATE TABLE task_assignees (
      task_id UUID REFERENCES tasks(id) ON DELETE CASCADE,
      user_id UUID REFERENCES users(id) ON DELETE CASCADE,
      PRIMARY KEY (task_id, user_id)
    );

    CREATE TABLE task_dependencies (
      task_id UUID REFERENCES tasks(id) ON DELETE CASCADE,
      depends_on_task_id UUID REFERENCES tasks(id) ON DELETE CASCADE,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (task_id, depends_on_task_id),
      CHECK (task_id <> depends_on_task_id)
    );

    CREATE TABLE task_watchers (
      task_id UUID REFERENCES tasks(id) ON DELETE CASCADE,
      user_id UUID REFERENCES users(id) ON DELETE CASCADE,
      PRIMARY KEY (task_id, user_id)
    );

    -- ---------------------------------------------------------------------------
    -- Tag: legati a un progetto, applicabili a qualsiasi task del progetto
    -- ---------------------------------------------------------------------------

    CREATE TABLE tags (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id UUID NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
      name TEXT NOT NULL,
      color TEXT,
      created_by UUID NOT NULL REFERENCES users(id),
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      UNIQUE (project_id, name)
    );
    CREATE INDEX tags_project_idx ON tags(project_id);

    CREATE TABLE task_tags (
      task_id UUID REFERENCES tasks(id) ON DELETE CASCADE,
      tag_id UUID REFERENCES tags(id) ON DELETE CASCADE,
      PRIMARY KEY (task_id, tag_id)
    );

    -- ---------------------------------------------------------------------------
    -- Commenti, menzioni, allegati
    -- ---------------------------------------------------------------------------

    CREATE TABLE comments (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      task_id UUID NOT NULL REFERENCES tasks(id) ON DELETE CASCADE,
      parent_comment_id UUID REFERENCES comments(id) ON DELETE CASCADE,
      author_id UUID NOT NULL REFERENCES users(id),
      body TEXT NOT NULL,
      edited_at TIMESTAMPTZ,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX comments_task_idx ON comments(task_id);

    CREATE TABLE comment_mentions (
      comment_id UUID REFERENCES comments(id) ON DELETE CASCADE,
      user_id UUID REFERENCES users(id) ON DELETE CASCADE,
      PRIMARY KEY (comment_id, user_id)
    );

    CREATE TABLE attachments (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      comment_id UUID REFERENCES comments(id) ON DELETE CASCADE,
      task_id UUID REFERENCES tasks(id) ON DELETE CASCADE,
      uploaded_by UUID NOT NULL REFERENCES users(id),
      storage_key TEXT NOT NULL,
      filename TEXT NOT NULL,
      content_type TEXT,
      size_bytes BIGINT,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      CHECK (comment_id IS NOT NULL OR task_id IS NOT NULL)
    );

    -- ---------------------------------------------------------------------------
    -- Board: un FILTRO SALVATO su un progetto (es. "assignee in team QA"), non un
    -- set di colonne proprio - le colonne sono quelle del progetto (board_columns,
    -- sopra), condivise da tutte le viste (kanban di default per layer, board
    -- custom). Lo stesso filtro alimenta sia la vista kanban sia la dashboard
    -- (torta) di quel sottoinsieme di task.
    -- ---------------------------------------------------------------------------

    CREATE TABLE boards (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      project_id UUID NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
      created_by UUID NOT NULL REFERENCES users(id),
      name TEXT NOT NULL,
      -- es: {"layer_ids": [...], "assignee_ids": [...], "team_ids": [...], "tag_ids": [...]}
      -- tutte le chiavi sono opzionali e si combinano in AND; layer_ids include
      -- automaticamente i sotto-layer (risoluzione via ltree, vedi projects.py).
      task_filter JSONB NOT NULL DEFAULT '{}',
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX boards_project_idx ON boards(project_id);

    -- ---------------------------------------------------------------------------
    -- Notifiche persistenti e audit log
    -- ---------------------------------------------------------------------------

    CREATE TABLE notifications (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      type notification_type NOT NULL,
      entity_type TEXT NOT NULL,
      entity_id UUID NOT NULL,
      payload JSONB NOT NULL DEFAULT '{}',
      read_at TIMESTAMPTZ,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX notifications_user_unread_idx ON notifications(user_id) WHERE read_at IS NULL;

    CREATE TABLE audit_logs (
      id BIGSERIAL PRIMARY KEY,
      actor_id UUID REFERENCES users(id),
      entity_type TEXT NOT NULL,
      entity_id UUID NOT NULL,
      action TEXT NOT NULL,
      diff JSONB,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX audit_entity_idx ON audit_logs(entity_type, entity_id);
  0002_task_readable_ids.sql: |
    -- Id leggibili e univoci per le task: <PREFISSO PROGETTO>-<numero progressivo
    -- nel progetto>, es. "QA-1". Il prefisso è scelto alla creazione del progetto
    -- (lunghezza fissa, vedi PROJECT_PREFIX_LENGTH in projects.py) e non è più
    -- modificabile dopo; il numero progressivo è assegnato in modo atomico da
    -- projects.next_task_number (vedi tasks.py::create_task). La primary key delle
    -- task resta lo UUID: l'id leggibile è solo un identificatore aggiuntivo per
    -- link/riferimenti (risolto a UUID lato server, vedi tasks.py::_resolve_task_id).

    ALTER TABLE projects ADD COLUMN prefix TEXT;
    ALTER TABLE projects ADD COLUMN next_task_number INT NOT NULL DEFAULT 1;

    -- backfill dei progetti già esistenti: un prefisso derivato dal nome, reso
    -- univoco con un suffisso numerico in caso di collisione, così il passaggio a
    -- NOT NULL/UNIQUE qui sotto non fallisce su dati creati prima di questa migrazione.
    DO $$
    DECLARE
      proj RECORD;
      candidate TEXT;
      base TEXT;
      suffix INT;
    BEGIN
      FOR proj IN SELECT id, name FROM projects ORDER BY created_at LOOP
        base := upper(regexp_replace(proj.name, '[^a-zA-Z]', '', 'g'));
        base := rpad(substring(base FROM 1 FOR 4), 4, 'X');
        candidate := base;
        suffix := 1;
        WHILE EXISTS (SELECT 1 FROM projects WHERE prefix = candidate) LOOP
          suffix := suffix + 1;
          candidate := rpad(substring(base FROM 1 FOR 3), 3, 'X') || suffix::text;
        END LOOP;
        UPDATE projects SET prefix = candidate WHERE id = proj.id;
      END LOOP;
    END $$;

    ALTER TABLE projects ALTER COLUMN prefix SET NOT NULL;
    ALTER TABLE projects ADD CONSTRAINT projects_prefix_unique UNIQUE (prefix);

    ALTER TABLE tasks ADD COLUMN task_number INT;

    -- backfill delle task esistenti: numerazione progressiva per progetto
    -- nell'ordine di creazione, e allineamento del contatore del progetto.
    WITH numbered AS (
      SELECT t.id, row_number() OVER (PARTITION BY l.project_id ORDER BY t.created_at) AS n
      FROM tasks t
      JOIN layers l ON l.id = t.layer_id
    )
    UPDATE tasks SET task_number = numbered.n
    FROM numbered
    WHERE tasks.id = numbered.id;

    ALTER TABLE tasks ALTER COLUMN task_number SET NOT NULL;

    UPDATE projects p
    SET next_task_number = COALESCE(
      (SELECT MAX(t.task_number) + 1 FROM tasks t JOIN layers l ON l.id = t.layer_id WHERE l.project_id = p.id),
      1
    );

    -- Nessun vincolo UNIQUE a livello DB su (project_id, task_number): tasks non ha
    -- una colonna project_id diretta (solo layer_id, il progetto si risale via
    -- layers.project_id) e un indice non può usare una subquery/join per calcolarlo.
    -- L'unicità per progetto è garantita dall'applicazione: task_number viene
    -- assegnato con un UPDATE atomico su projects.next_task_number (lock di riga)
    -- nella stessa transazione dell'INSERT, vedi tasks.py::create_task - due
    -- richieste concorrenti sullo stesso progetto non possono ottenere lo stesso
    -- numero perché la seconda UPDATE resta bloccata finché la prima transazione
    -- non committa.
  0003_group_assignments.sql: |
    -- Un gruppo (team) può essere trattato come un utente in due punti:
    -- 1) task_assignees diventa polimorfico (principal_type/principal_id, stesso
    --    pattern già usato da role_assignments) così una task può essere assegnata
    --    a un team intero, non solo a singoli utenti.
    -- 2) i permessi (role_assignments) e le menzioni nei commenti già supportavano
    --    i team a livello di schema/CTE di visibilità (vedi principal_type in
    --    0001_init.sql) - qui si aggiunge solo la UI e, per le menzioni, non serve
    --    nessuna migrazione (si espande il team ai suoi membri al momento della
    --    creazione del commento, vedi comments.py).

    ALTER TABLE task_assignees DROP CONSTRAINT task_assignees_user_id_fkey;
    ALTER TABLE task_assignees DROP CONSTRAINT task_assignees_pkey;
    ALTER TABLE task_assignees RENAME COLUMN user_id TO principal_id;
    ALTER TABLE task_assignees ADD COLUMN principal_type principal_type NOT NULL DEFAULT 'user';
    ALTER TABLE task_assignees ALTER COLUMN principal_type DROP DEFAULT;
    ALTER TABLE task_assignees ADD PRIMARY KEY (task_id, principal_type, principal_id);

    -- NOTA: niente più FK diretta su principal_id (può puntare a users o teams a
    -- seconda di principal_type) - stessa scelta e stessa nota di integrità
    -- applicativa già fatta per role_assignments in 0001_init.sql.
  0004_soft_delete.sql: |
    -- Cancellazione logica per organizations e users: projects/layers/tasks hanno
    -- già archived_at dalla migrazione iniziale (0001_init.sql) - qui si completa
    -- lo schema per gli altri due livelli della gerarchia e per l'account utente.
    -- Cancellare un'organizzazione/progetto/layer archivia a cascata tutto quello
    -- che contiene (vedi gli endpoint DELETE nei rispettivi router): con la
    -- gerarchia Organization -> Project -> Layer -> Task, lasciare "orfani"
    -- visibili dei figli di una risorsa archiviata sarebbe incoerente.

    ALTER TABLE organizations ADD COLUMN archived_at TIMESTAMPTZ;

    -- Nome diverso da archived_at apposta: qui non si tratta di archiviare una
    -- risorsa di lavoro ma di disattivare un account (impedisce login/refresh,
    -- lo esclude dalla ricerca utenti/menzioni) - vedi me.py::deactivate_me.
    ALTER TABLE users ADD COLUMN deactivated_at TIMESTAMPTZ;
kind: ConfigMap
metadata:
  name: db-init
  namespace: wav-platform
