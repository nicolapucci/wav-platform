# Service di tipo LoadBalancer (non Ingress): scelta deliberata per restare
# fedeli al docker-compose originale, dove nginx e' l'unico entrypoint esposto
# sulla porta 80 dell'host. Su Docker Desktop il LoadBalancer viene esposto
# direttamente su localhost, stesso comportamento del "ports: 80:80" di prima.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: wav-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-tls
              mountPath: /etc/nginx/certs
              readOnly: true
          # vedi 20-auth-service.yaml per il perché di resources/HPA
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # su 443/HTTPS (non più su 80, che ora risponde solo con un redirect):
          # kubelet non verifica il certificato del probe, quindi il self-signed
          # va bene così com'è, senza nessuna opzione aggiuntiva.
          readinessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: nginx-tls
          secret:
            secretName: nginx-tls
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: wav-platform
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx
  namespace: wav-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
