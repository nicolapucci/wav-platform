# Solo Deployment, nessun Service: e' un consumer in background (nessun
# server HTTP, vedi CMD del Dockerfile), quindi niente da esporre ne' da
# controllare con probe HTTP - stessa forma che aveva in docker-compose
# (nessuna porta pubblicata, nessun healthcheck).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: wav-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
        - name: worker-service
          image: wav-platform-worker-service:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # vedi 20-auth-service.yaml per il perché di resources/HPA
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Niente Service (nessun server HTTP), ma l'HPA non ne ha bisogno: legge solo
# la CPU dei pod. Più repliche funzionano di serie: sono consumer dello stesso
# gruppo su stream:jobs, e XREADGROUP distribuisce i messaggi round-robin tra
# chi è iscritto, senza bisogno di coordinamento applicativo (vedi main.py).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-service
  namespace: wav-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
