# Template: il Secret vero (k8s/29-secret-nginx-tls.yaml, gitignorato) non va mai
# committato con un certificato/chiave reali dentro. Per ora è lo stesso
# self-signed usato da compose (vedi il commento sul volume "certs" in
# docker-compose.yml per rigenerarlo); quando si integra Let's Encrypt basterà
# sostituire cert/key con quelli emessi da cert-manager/certbot e riapplicare
# lo stesso comando:
#
#   kubectl create secret tls nginx-tls -n wav-platform \
#     --cert=nginx/certs/tls.crt --key=nginx/certs/tls.key \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: nginx-tls
  namespace: wav-platform
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
