# Variante di nginx/nginx.conf adattata per Kubernetes, non una copia identica:
# l'originale usa "resolver 127.0.0.11" (il DNS interno di Docker) più un
# proxy_pass costruito da variabile per forzare nginx a ri-risolvere l'upstream
# ogni 10s, workaround necessario perché un container Docker ricreato può
# cambiare IP mentre nginx tiene la connessione aperta. In Kubernetes questo
# problema non esiste: un Service ha un ClusterIP stabile per tutta la sua vita
# (kube-proxy fa il load balancing verso i pod dietro, il DNS non deve essere
# ri-risolto), quindi qui si torna a proxy_pass "statico", più semplice - e come
# effetto collaterale la query string sul canale /ws torna a essere inoltrata
# automaticamente da nginx stesso, senza bisogno di $is_args$args.
events {}

http {
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        # Self-signed per ora, montato dal Secret "nginx-tls" (vedi
        # k8s/29-secret-nginx-tls.example.yaml per come generarlo) - da
        # sostituire con un certificato Let's Encrypt quando si prepara il
        # deploy vero.
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        location /auth/ {
            proxy_pass http://auth-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://api-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws {
            proxy_pass http://ws-gateway:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }
    }
}
