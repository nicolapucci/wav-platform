# Template: copia in 02-secret-app.yaml (gitignorato, vedi root .gitignore) e
# riempi i valori veri prima di "kubectl apply -f k8s/02-secret-app.yaml" -
# oppure, più comodo, genera il Secret direttamente dal tuo .env esistente
# senza scriverlo mai su disco:
#
#   kubectl create secret generic app-secrets -n wav-platform \
#     --from-env-file=.env \
#     --from-literal=POSTGRES_PASSWORD=wav \
#     --from-literal=MINIO_ROOT_PASSWORD=wavminio123 \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# (i valori qui sotto sono gli stessi placeholder di dev già in .env.example -
# in un deploy vero vanno sostituiti con segreti reali, non committati mai).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: wav-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql://wav:wav@postgres:5432/wav
  JWT_SECRET: change-me-super-secret
  S3_ACCESS_KEY: wavminio
  S3_SECRET_KEY: wavminio123
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
  POSTGRES_PASSWORD: wav
  MINIO_ROOT_PASSWORD: wavminio123
