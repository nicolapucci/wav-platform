name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-service, auth-service, worker-service, ws-gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ogni conftest.py del servizio avvia da sé i container Postgres/Redis
      # effimeri che gli servono (docker run diretto, non docker-compose) e li
      # smonta a fine sessione: ai runner ubuntu-latest, che hanno Docker già
      # disponibile, non serve altro setup.
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements-test.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test
